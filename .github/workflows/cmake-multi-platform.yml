name: CMake on multiple platforms

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Newer releases replace -sUSE_WEBGPU=1 with the emdawnwebgpu port
  EMSCRIPTEN_VERSION: 3.1.74

jobs:
  build:
    name: build (${{ matrix.platform }} ${{ matrix.arch }})
    runs-on: ${{ matrix.os }}

    # There's no Windows arm64 build of the wgpu-native version we use; Windows on Arm runs the x64 build
    strategy:
      fail-fast: false

      matrix:
        build_type: [Release]
        include:
          - { os: windows-latest, platform: Windows, arch: x64 }
          - { os: macos-latest, platform: macOS, arch: arm64 }
          - { os: macos-15-intel, platform: macOS, arch: x64 }
          - { os: ubuntu-latest, platform: Linux, arch: x64 }
          - { os: ubuntu-24.04-arm, platform: Linux, arch: arm64 }

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: "recursive"

      - name: Set reusable strings
        id: strings
        shell: bash
        run: |
          echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        if: matrix.platform == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --fix-missing libx11-dev libxrandr-dev libxi-dev libxinerama-dev libgl1-mesa-dev libxcursor-dev mesa-common-dev

      - name: Configure CMake
        run: >
          cmake -B ${{ steps.strings.outputs.build-output-dir }}
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DATTERCOP_ENABLE_UNITY_BUILD=ON
          -S ${{ github.workspace }}

      - name: Build
        run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config ${{ matrix.build_type }}

      - name: Test
        working-directory: ${{ steps.strings.outputs.build-output-dir }}
        run: ctest --build-config ${{ matrix.build_type }} --output-on-failure -j 4 -L scene

  # The web Editor and Runtime, uploaded ready to serve with any static web server
  web:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: "recursive"

      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v16
        with:
          version: ${{ env.EMSCRIPTEN_VERSION }}
          actions-cache-folder: emsdk-cache

      - name: Configure CMake
        run: emcmake cmake -B build_web -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -S ${{ github.workspace }}

      # Building Editor builds Runtime too, and copies it next to the Editor for Export Game
      - name: Build
        run: cmake --build build_web --config ${{ matrix.build_type }} --target Editor --parallel 4

      - name: Collect output
        run: |
          mkdir -p web
          cp build_web/Editor/Editor.{html,js,wasm,data} build_web/Editor/Runtime.{html,js,wasm,data} build_web/Editor/favicon.png web/
          ls -l web

      # itch.io rejects any single file over 200 MB
      - name: Check file sizes
        run: |
          limit=$((200 * 1024 * 1024))
          for file in web/*.wasm; do
            size=$(stat -c %s "$file")
            echo "$file: $((size / 1024 / 1024)) MB"
            if [ "$size" -gt "$limit" ]; then
              echo "::error file=$file::$file is over itch.io's 200 MB limit"
              exit 1
            fi
          done

      - name: Upload web build
        uses: actions/upload-artifact@v7
        with:
          name: attercop-web
          path: web
          retention-days: 14
