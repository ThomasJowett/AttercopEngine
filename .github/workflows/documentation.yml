name: Build and deploy documentation

# Builds the Editor, runs --generate-docs to produce the Lua API reference Markdown (see
# DocGenerator.cpp), renders the full site (that plus the hand-written pages) with MkDocs +
# Material (see mkdocs.yml), and deploys straight to GitHub Pages. Everything happens inside
# this workflow run - nothing is ever committed back to the repo.
# Pull requests only build the site; publishing a release deploys it with that release's web
# Editor, so the site and the web Editor stay in step.
on:
  pull_request:
    paths:
      - "Engine/src/Scripting/Lua/**"
      - "Engine/src/Scene/Components/**"
      - "Editor/src/FileSystem/DocGenerator.*"
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/documentation.yml"
  release:
    types: [published]
  # Run on a release tag to deploy that release again
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.deploy.outputs.deploy }}
    steps:
      - name: Check for a release
        id: deploy
        run: echo "deploy=${{ github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/')) }}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          submodules: "recursive"

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --fix-missing libx11-dev libxrandr-dev libxi-dev libxinerama-dev libgl1-mesa-dev libxcursor-dev mesa-common-dev

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DATTERCOP_ENABLE_UNITY_BUILD=ON -S .

      # Only builds what GenerateDocs depends on (Editor and its dependencies), not the
      # full multi-platform matrix the main CI workflow builds.
      - name: Generate Lua API reference
        run: cmake --build build --target GenerateDocs

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install MkDocs
        run: pip install -r docs/requirements.txt

      - name: Build site
        run: mkdocs build --strict --site-dir site

      # Every deploy replaces the whole site, so the release's web Editor is added each time, at /editor/
      - name: Add the web Editor
        if: steps.deploy.outputs.deploy == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          if ! gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern '*-Web.zip' --dir web; then
            echo "::warning::No web build in release $tag, so the site has no web Editor"
            exit 0
          fi
          unzip -q web/*-Web.zip -d web
          mkdir -p site/editor
          cp web/*-Web/* site/editor/
          mv site/editor/Editor.html site/editor/index.html
          ls -l site/editor

      - name: Upload Pages artifact
        if: steps.deploy.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    if: needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: "pages"
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
